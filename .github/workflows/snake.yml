name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG (grayscale palette)
        uses: Platane/snk@v3
        with:
          github_user_name: uziii2208
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffffff&color_dots=%230d0d0d,%23333333,%23666666,%23999999,%23ffffff

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
